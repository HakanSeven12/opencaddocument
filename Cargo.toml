[package]
name = "opencaddocument"
version = "0.1.0"
edition = "2021"
description = "Shared, DWG-centred drawing model with converters to and from other formats"
license = "MPL-2.0"
repository = "https://github.com/HakanSeven12/opencaddocument"

[features]
mline-pilot = ["ifcx", "selection-storage"]
selection = []
selection-storage = ["selection", "dep:serde", "dep:rmp-serde"]
serde = ["acadrust/serde", "dep:serde"]
# IFCX through the ifccad library (OpenAEC Foundation).
ifcx = ["dep:ifccad", "dep:web-time"]

[dependencies]
acadrust = { git = "https://github.com/hakanaktt/acadrust.git", rev = "f8ea35c" }
rmp-serde = { version = "=1.3.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# ifccad only reads and writes IFCX; the mapping to `Document` lives here.
ifccad = { git = "https://github.com/OpenAEC-Foundation/ifccad.git", rev = "a09aeb27c5964f39c2b94ac99ac49255339cb3ff", optional = true }
web-time = { version = "1", optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace]

[[example]]
name = "annotation_gallery"
required-features = ["ifcx"]

[[example]]
name = "font_symbol_review"
required-features = ["ifcx"]

[[example]]
name = "attribute_review"
required-features = ["ifcx"]

[[example]]
name = "block_attributes_gallery"
required-features = ["ifcx"]

[[example]]
name = "leaders_gallery"
required-features = ["ifcx"]
